# 2.2.13 — replication demo. replication_factor: 3 keeps THREE copies of every
# chunk across THREE ingesters, so losing one ingester loses no data. This needs
# multiple ingesters, so we run SimpleScalable (write = ingesters) with 3 write
# replicas + bundled MinIO. auth off to keep the focus on replication.
deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 3               # <-- the demo: 3 copies of each chunk
  storage:
    type: s3
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true

minio:
  enabled: true

write:   { replicas: 3 }                 # 3 ingesters — must be >= replication_factor
read:    { replicas: 1 }
backend: { replicas: 1 }

singleBinary:  { replicas: 0 }
ingester:      { replicas: 0 }
querier:       { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler:{ replicas: 0 }
distributor:   { replicas: 0 }
compactor:     { replicas: 0 }
indexGateway:  { replicas: 0 }
bloomPlanner:  { replicas: 0 }
bloomBuilder:  { replicas: 0 }
bloomGateway:  { replicas: 0 }

gateway:
  enabled: true
  service: { type: ClusterIP }

chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }
