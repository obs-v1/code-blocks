# ============================================================================
# 1.3.13 — relabel demo: DROP every scrape that isn't in the payments namespace
# ----------------------------------------------------------------------------
# A one-job kind Prometheus that discovers every pod, shows the namespace each
# one came from, and then (when you enable the keep rule) throws away every
# target that is not in the `payments` namespace.
#
# 0) Deploy the sample workloads so there's something to filter:
#      kubectl apply -f payments-demo.yaml
#
# 1) Point Prometheus at this file:
#      helm upgrade -i prometheus prometheus-community/prometheus -n monitoring \
#        --create-namespace -f prometheus-values-relabel-demo.yaml
#
# 2) Open http://localhost:9090  (kind maps host :9090 -> NodePort 30990).
#    Status -> Targets  (or  Status -> Service Discovery)  now lists pods from
#    EVERY namespace — payments, orders, kube-system, monitoring. The `namespace`
#    column is populated by the replace rule below, so students can see it.
#
# 3) THE DEMO: uncomment the "keep only payments" rule at the bottom, re-run the
#    helm command in step 1, and refresh Status -> Targets. Everything that is
#    not in the payments namespace vanishes — orders and kube-system included.
#    (keep = keep what matches, drop the rest — so "keep payments" IS "drop
#    everything that is not payments.")
# ============================================================================

# Turn OFF every built-in job, so the Targets page shows ONLY our demo job.
scrapeConfigs:
  prometheus:                        { enabled: false }
  kubernetes-api-servers:            { enabled: false }
  kubernetes-nodes:                  { enabled: false }
  kubernetes-nodes-cadvisor:         { enabled: false }
  kubernetes-service-endpoints:      { enabled: false }
  kubernetes-service-endpoints-slow: { enabled: false }
  kubernetes-services:               { enabled: false }
  kubernetes-pods:                   { enabled: false }
  kubernetes-pods-slow:              { enabled: false }
  prometheus-pushgateway:            { enabled: false }

  # ── the one demo job ──────────────────────────────────────────────────────
  relabel-demo:
    enabled: true
    honor_labels: true
    kubernetes_sd_configs:
      - role: pod                    # discover EVERY pod in EVERY namespace

    relabel_configs:
      # Make the labels we care about visible on the targets and on `up`,
      # so the class can SEE the namespace we're about to filter on.
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - action: labelmap                       # bonus: expose the pod's own labels
        regex: __meta_kubernetes_pod_label_(.+)

      # ── THE DEMO RULE — drop everything that isn't the payments namespace ──
      # Leave commented to show the "before" (all namespaces). Uncomment and
      # re-apply to show the "after" (only payments survives).
      #
      # - source_labels: [__meta_kubernetes_namespace]
      #   action: keep
      #   regex: payments

# Expose the UI on kind's host-port mapping (host :9090 -> this NodePort).
server:
  service:
    type: NodePort
    nodePort: 30990

# Keep the install tiny — this is a relabel demo, not a monitoring stack.
alertmanager:             { enabled: false }
prometheus-node-exporter: { enabled: false }
kube-state-metrics:       { enabled: false }
prometheus-pushgateway:   { enabled: false }
