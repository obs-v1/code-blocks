# 2.2.14 — THE PROBLEM: limits wide open. Nothing caps how many streams a tenant
# can create, so a runaway producer's high-cardinality flood is swallowed whole —
# exactly the cardinality explosion of 2.2.3, now unprotected.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    # effectively unlimited — this is the unprotected state
    max_global_streams_per_user: 100000
    ingestion_rate_mb: 50
    ingestion_burst_size_mb: 100
    per_stream_rate_limit: 50MB
    per_stream_rate_limit_burst: 100MB

singleBinary:
  replicas: 1
  persistence: { enabled: false }        # emptyDir — a restart starts clean (no WAL replay)

backend:       { replicas: 0 }
read:          { replicas: 0 }
write:         { replicas: 0 }
ingester:      { replicas: 0 }
querier:       { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler:{ replicas: 0 }
distributor:   { replicas: 0 }
compactor:     { replicas: 0 }
indexGateway:  { replicas: 0 }
bloomPlanner:  { replicas: 0 }
bloomBuilder:  { replicas: 0 }
bloomGateway:  { replicas: 0 }

gateway: { enabled: true, service: { type: ClusterIP } }
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }
minio:        { enabled: false }
