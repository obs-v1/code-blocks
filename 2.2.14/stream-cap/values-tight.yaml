# 2.2.14 — THE FIX: the same Loki, with limits_config set. max_global_streams_per_user
# caps active streams per tenant, so the runaway flood is rejected (HTTP 429)
# once it hits the ceiling — Loki stays healthy. Rate caps are here too.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    # THE GUARDRAILS
    max_global_streams_per_user: 50        # cap active streams (the cardinality guard)
    ingestion_rate_mb: 4                    # per-tenant write-rate cap
    ingestion_burst_size_mb: 6
    per_stream_rate_limit: 256KB            # one stream can't drown the rest
    per_stream_rate_limit_burst: 512KB

singleBinary:
  replicas: 1
  persistence: { enabled: false }        # emptyDir — the solve restart starts clean (no WAL replay)

backend:       { replicas: 0 }
read:          { replicas: 0 }
write:         { replicas: 0 }
ingester:      { replicas: 0 }
querier:       { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler:{ replicas: 0 }
distributor:   { replicas: 0 }
compactor:     { replicas: 0 }
indexGateway:  { replicas: 0 }
bloomPlanner:  { replicas: 0 }
bloomBuilder:  { replicas: 0 }
bloomGateway:  { replicas: 0 }

gateway: { enabled: true, service: { type: ClusterIP } }
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }
minio:        { enabled: false }
