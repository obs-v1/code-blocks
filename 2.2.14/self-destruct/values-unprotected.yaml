# 2.2.14 self-destruct — THE PROBLEM, for real. Every protective limit is turned
# OFF, and the Loki pod is capped at a small memory limit. A high-cardinality
# flood then piles streams into ingester memory until it OOMs — OOMKilled,
# CrashLoopBackOff, Loki DOWN. It fails under its own load, nothing stops it.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    # ALL GUARDS OFF — nothing caps cardinality or write rate
    max_global_streams_per_user: 0          # 0 = unlimited
    max_streams_per_user: 0                  # 0 = unlimited
    ingestion_rate_mb: 10240
    ingestion_burst_size_mb: 20480
    per_stream_rate_limit: 2GB
    per_stream_rate_limit_burst: 4GB
    reject_old_samples: false

singleBinary:
  replicas: 1
  persistence: { enabled: false }            # emptyDir
  # a deliberately small memory ceiling so the flood can OOM it in a demo.
  # tune MEM up/down to your node — too low OOMs on boot, too high never OOMs.
  resources:
    requests: { cpu: 100m, memory: 200Mi }
    limits:   { memory: 350Mi }

backend:       { replicas: 0 }
read:          { replicas: 0 }
write:         { replicas: 0 }
ingester:      { replicas: 0 }
querier:       { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler:{ replicas: 0 }
distributor:   { replicas: 0 }
compactor:     { replicas: 0 }
indexGateway:  { replicas: 0 }
bloomPlanner:  { replicas: 0 }
bloomBuilder:  { replicas: 0 }
bloomGateway:  { replicas: 0 }

gateway: { enabled: true, service: { type: ClusterIP } }
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }
minio:        { enabled: false }
