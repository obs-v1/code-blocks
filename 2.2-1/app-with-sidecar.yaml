# 2.2-1 — the SIDECAR shipping pattern (contrast with 2.2's node DaemonSet).
#
# The app writes its JSON logs to a FILE on a volume it SHARES with a Promtail
# container running in the SAME pod. The sidecar tails that file and pushes to
# Loki. No node access, no discovery, no relabeling — the shipper only ever sees
# this one app's logs. One sidecar per pod (vs one DaemonSet agent per node).
#
# Everything lives in namespace `sidecar-demo`, so it does not disturb 2.2.
apiVersion: v1
kind: Namespace
metadata:
  name: sidecar-demo
---
# Promtail sidecar config — tails the shared file, runs the same four pipeline
# stages as 2.2 (parse, drop, scrub, timestamp, promote), pushes to this
# example's own Loki. Uses static_configs (a fixed file path) instead of
# kubernetes_sd — the sidecar has nothing to discover.
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-sidecar
  namespace: sidecar-demo
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki-gateway.sidecar-demo.svc/loki/api/v1/push
    scrape_configs:
      - job_name: app
        static_configs:
          - targets: [localhost]
            labels:
              job: sidecar-app
              __path__: /var/log/app/*.log        # THE shared file, not node logs
        pipeline_stages:
          # 1) PARSE — our app writes JSON straight to the file (no CRI wrapper).
          - json:
              expressions:
                level: level
                service: service
                event: event
                ts: timestamp
                msg: message
          # 2) DROP — health/probe noise never reaches the store.
          - drop:
              expression: ".*(/health|/healthz|/actuator/health|healthcheck|readiness|liveness).*"
              drop_counter_reason: "healthcheck"
          # 3) SCRUB — second-layer redaction for a leaked password/token/PAN.
          - replace:
              expression: '(?i)(password|passwd|pwd|token|secret)["\s:=]+([^\s",}]+)'
              replace: '${1}=***REDACTED***'
          - replace:
              expression: '\b(\d{13,19})\b'
              replace: '***PAN-REDACTED***'
          # 4) TIMESTAMP — trust the app's clock, not ingestion time.
          - timestamp:
              source: ts
              format: RFC3339Nano
              action_on_failure: fudge
          # PROMOTE — only enumerable fields become labels. NEVER trace_id.
          - labels:
              level:
              service:
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-app
  namespace: sidecar-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: sidecar-app }
  template:
    metadata:
      labels: { app: sidecar-app }
    spec:
      volumes:
        - name: varlog            # shared between app and sidecar
          emptyDir: {}
        - name: config
          configMap: { name: promtail-sidecar }
        - name: positions
          emptyDir: {}
      containers:
        # ── the application: writes the same three lines as 2.2's leaky-app,
        #    but to a FILE on the shared volume (not stdout). ──
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "{\"level\":\"INFO\",\"service\":\"sidecar-app\",\"event\":\"order-created\",\"message\":\"order created\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000000000Z)\"}" >> /var/log/app/app.log
                echo "{\"level\":\"DEBUG\",\"service\":\"sidecar-app\",\"event\":\"healthcheck\",\"message\":\"GET /healthz 200\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000000000Z)\"}" >> /var/log/app/app.log
                echo "{\"level\":\"INFO\",\"service\":\"sidecar-app\",\"event\":\"login\",\"message\":\"auth ok password=Sup3rSecret! token=abc123xyz\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000000000Z)\"}" >> /var/log/app/app.log
                sleep 3
              done
          volumeMounts:
            - { name: varlog, mountPath: /var/log/app }
        # ── the SIDECAR shipper: tails the shared file, ships to Loki ──
        - name: promtail
          image: grafana/promtail:3.1.1
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          volumeMounts:
            - { name: varlog,    mountPath: /var/log/app, readOnly: true }
            - { name: config,    mountPath: /etc/promtail }
            - { name: positions, mountPath: /run/promtail }
