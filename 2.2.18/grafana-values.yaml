# 2.2.18 — Grafana with the Loki datasource, to browse what the pipeline parsed.
service:
  type: NodePort
  nodePort: 31301                  # 31300 is used by 2.2.19; this lab uses 31301
adminUser: admin
adminPassword: admin
persistence:
  enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-pipeline-gateway.logging.svc
        isDefault: true
