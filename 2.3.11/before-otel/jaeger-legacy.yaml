# before-otel — Jaeger all-in-one with the LEGACY ingest ports enabled, so the pre-OTel
# clients (jaeger-client / OpenCensus) can report to it. They send batched Thrift over
# HTTP to the collector on :14268 (we avoid the UDP agent, which is flaky in kind).
# One backend for both old-style apps; UI on NodePort 31687 (keeps clear of 2.3.1's 31686).
apiVersion: v1
kind: Namespace
metadata: { name: tracing-legacy }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-legacy
  namespace: tracing-legacy
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger-legacy } }
  template:
    metadata:
      labels: { app: jaeger-legacy }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          ports:
            - { containerPort: 16686 }   # UI + query API
            - { containerPort: 14268 }   # collector: Thrift over HTTP (old clients post here)
            - { containerPort: 9411 }    # collector: Zipkin (handy for Zipkin-based clients)
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-legacy            # pre-OTel clients report to :14268 here
  namespace: tracing-legacy
spec:
  selector: { app: jaeger-legacy }
  ports:
    - { name: thrift-http, port: 14268, targetPort: 14268 }
    - { name: zipkin,      port: 9411,  targetPort: 9411 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-legacy-query      # UI + query API
  namespace: tracing-legacy
spec:
  type: NodePort
  selector: { app: jaeger-legacy }
  ports:
    - { name: ui, port: 16686, targetPort: 16686, nodePort: 31687 }   # kind host :16687
