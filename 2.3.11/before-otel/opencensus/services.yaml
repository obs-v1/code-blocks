# before-otel / OpenCensus — two services. frontend -> backend, context
# propagated by OpenCensus (traceparent). Reports to the lab Jaeger agent on :6831.
# Service names oc-frontend / oc-backend keep it distinct from the OpenTracing demo.
apiVersion: v1
kind: Namespace
metadata: { name: ocensus }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: ocensus }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: app
          image: trace-oc:1.0          # built + kind-loaded by the Makefile
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: "backend" }
            - { name: SERVICE_NAME, value: "oc-backend" }
            - { name: JAEGER_AGENT_HOST, value: "jaeger-collector.tracing.svc" }
          ports: [ { containerPort: 8080 } ]
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: ocensus }
spec:
  selector: { app: backend }
  ports: [ { port: 8080, targetPort: 8080 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: ocensus }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: app
          image: trace-oc:1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: "frontend" }
            - { name: SERVICE_NAME, value: "oc-frontend" }
            - { name: BACKEND_URL, value: "http://backend.ocensus.svc:8080/work" }
            - { name: JAEGER_AGENT_HOST, value: "jaeger-collector.tracing.svc" }
          ports: [ { containerPort: 8080 } ]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: ocensus }
spec:
  selector: { app: frontend }
  ports: [ { port: 8080, targetPort: 8080 } ]
