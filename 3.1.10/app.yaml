apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: monitoring
  labels: { app: demo-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: demo-app } }
  template:
    metadata:
      labels: { app: demo-app }
    spec:
      containers:
        - name: app
          image: demo-slo-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: monitoring
  labels: { app: demo-app }
spec:
  selector: { app: demo-app }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
# Tell the Prometheus Operator to scrape the app's /metrics, and stamp a stable
# job="demo-app" label so the SLO query is predictable.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app
  namespace: monitoring
  labels: { app: demo-app }
spec:
  selector:
    matchLabels: { app: demo-app }
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
      relabelings:
        - targetLabel: job
          replacement: demo-app
