scrapeConfigs:
  kubernetes-api-servers:            { enabled: false }
  kubernetes-nodes:                  { enabled: false }
  kubernetes-nodes-cadvisor:         { enabled: false }
  kubernetes-pods:                   { enabled: false }
  kubernetes-pods-slow:              { enabled: false }
  kubernetes-service-endpoints:      { enabled: false }
  kubernetes-service-endpoints-slow: { enabled: false }
  kubernetes-services:               { enabled: false }
  prometheus-pushgateway:            { enabled: false }

  # ── Target 1 · node_exporter (the host: CPU, memory, disk, network) ─────────
  # The key below becomes the job_name. Point it at the EC2 box running
  # node_exporter on :9100 (installed by install-exporters.sh).
  my-static-server:
    enabled: true
    static_configs:
      - targets:
          - "172.31.29.33:9100"     # ← replace with your server's IP or hostname

  # ── Target 2 · mongodb_exporter (the database) ──────────────────────────────
  # install-exporters.sh also runs mongodb_exporter on :9216 on the SAME box.
  # Scrape it too, so Prometheus monitors the database — not just the host.
  mongodb-exporter:
    enabled: true
    static_configs:
      - targets:
          - "172.31.29.33:9216"     # ← same server IP as above

alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-pushgateway:
  enabled: false