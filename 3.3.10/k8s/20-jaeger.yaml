# Jaeger all-in-one — the trace backend. OTLP ingestion is turned on so the
# Collector can ship spans straight in on :4317. UI on :16686 (kind → host 16686).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels: { app: jaeger }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.64.0
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          ports:
            - { name: ui,       containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels: { app: jaeger }
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui,       port: 16686, targetPort: 16686, nodePort: 30686 }   # → kind host 16686
    - { name: otlp-grpc, port: 4317,  targetPort: 4317 }                    # Collector → Jaeger
