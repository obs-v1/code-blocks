# Prometheus receives metrics by remote-write from the Collector. Two flags matter:
#   --web.enable-remote-write-receiver   accept the Collector's pushed metrics
#   --enable-feature=exemplar-storage    KEEP exemplars → the metric→trace pivot works
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    # No scrape jobs needed — metrics arrive via remote-write from the Collector.
    scrape_configs: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-remote-write-receiver"
            - "--enable-feature=exemplar-storage"
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data,   mountPath: /prometheus }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090, nodePort: 30909 }   # → kind host 9090
