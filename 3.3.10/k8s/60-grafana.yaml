# Grafana — the single pane. All four datasources are provisioned AND wired to
# pivot into each other, which is the whole point of this lab:
#   Prometheus --exemplar--> Jaeger      (metric → trace)
#   Jaeger   --tracesToLogsV2--> Loki     (trace → logs)
#   Loki   --derivedFields--> Jaeger      (log  → trace)
#   Jaeger --tracesToProfiles--> Pyroscope (trace → code / flame graph)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: jaeger

      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            filterByTraceID: true
            tags:
              - { key: 'service.name', value: 'service_name' }
          # trace → code: on Jaeger this is best-effort (Tempo has it natively).
          # If Grafana ignores it here, the fallback is the per-service flame graph.
          tracesToProfiles:
            datasourceUid: pyroscope
            profileTypeId: 'process_cpu:cpu:nanoseconds:cpu:nanoseconds'
            tags:
              - { key: 'service.name', value: 'service_name' }

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: jaeger
              url: '${__value.raw}'

      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope:4040
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: { app: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
          ports: [{ name: http, containerPort: 3000 }]
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels: { app: grafana }
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30300 }   # → kind host 3000
