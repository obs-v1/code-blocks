# Pyroscope — the profiling backend (the fourth pillar). The app SDKs push
# CPU/alloc profiles here directly on :4040; Grafana reads flame graphs from it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  namespace: monitoring
  labels: { app: pyroscope }
spec:
  replicas: 1
  selector: { matchLabels: { app: pyroscope } }
  template:
    metadata: { labels: { app: pyroscope } }
    spec:
      containers:
        - name: pyroscope
          image: grafana/pyroscope:1.13.4
          args: ["-config.file=/etc/pyroscope/config.yaml"]
          ports: [{ name: http, containerPort: 4040 }]
          volumeMounts:
            - { name: data,   mountPath: /data }
            - { name: config, mountPath: /etc/pyroscope }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap: { name: pyroscope-config }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pyroscope-config
  namespace: monitoring
data:
  config.yaml: |
    # Single-binary "all" target with local filesystem storage — enough for a lab.
    server:
      http_listen_port: 4040
    pyroscopedb:
      data_path: /data
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: monitoring
  labels: { app: pyroscope }
spec:
  type: NodePort
  selector: { app: pyroscope }
  ports:
    - { name: http, port: 4040, targetPort: 4040, nodePort: 30040 }   # → kind host 4040
