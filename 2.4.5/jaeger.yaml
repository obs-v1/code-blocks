# 2.4.5 — Jaeger all-in-one (collector + query + UI, in-memory). OTLP enabled so
# the Collector can export straight to it on :4317.
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: otel24 }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          ports:
            - { containerPort: 16686 }   # UI
            - { containerPort: 4317 }     # OTLP gRPC
---
apiVersion: v1
kind: Service
metadata: { name: jaeger-collector, namespace: otel24 }   # the Collector exports here
spec:
  selector: { app: jaeger }
  ports: [ { name: otlp-grpc, port: 4317, targetPort: 4317 } ]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger-query, namespace: otel24 }        # UI + query API
spec:
  # ClusterIP (not NodePort) so this lab coexists with 2.3, which owns host :16686.
  type: ClusterIP
  selector: { app: jaeger }
  ports: [ { name: ui, port: 16686, targetPort: 16686 } ]
