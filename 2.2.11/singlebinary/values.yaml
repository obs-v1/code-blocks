# SingleBinary — every Loki component in ONE process. Simplest; fine into a few
# GB/day. Local filesystem storage, one replica. (This is the 2.2 lab's Loki.)
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi

# every other mode's components OFF — the one process does all their jobs
backend:       { replicas: 0 }
read:          { replicas: 0 }
write:         { replicas: 0 }
ingester:      { replicas: 0 }
querier:       { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler:{ replicas: 0 }
distributor:   { replicas: 0 }
compactor:     { replicas: 0 }
indexGateway:  { replicas: 0 }
bloomPlanner:  { replicas: 0 }
bloomBuilder:  { replicas: 0 }
bloomGateway:  { replicas: 0 }

gateway:
  enabled: true
  service: { type: ClusterIP }

# keep the demo tiny — no caches, canary, or test pod
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }
minio:        { enabled: false }
