# 2.4.8 lab — the OTel Collector as a GATEWAY with tail_sampling.
# Services export here (not straight to Jaeger). The Collector buffers each whole
# trace, then keeps it if any span errored OR it was slow, else samples 10%.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      tail_sampling:
        decision_wait: 5s          # hold a trace's spans this long, then decide
        policies:
          - name: keep-errors
            type: status_code
            status_code: { status_codes: [ERROR] }
          - name: keep-slow
            type: latency
            latency: { threshold_ms: 300 }
          - name: sample-the-rest
            type: probabilistic
            probabilistic: { sampling_percentage: 10 }
      batch: { timeout: 2s }
    exporters:
      otlp/jaeger:
        endpoint: jaeger-collector.otel.svc:4317
        tls: { insecure: true }
    service:
      pipelines:
        traces:
          receivers:  [otlp]
          processors: [memory_limiter, tail_sampling, batch]   # order = execution
          exporters:  [otlp/jaeger]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: otel }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.109.0
          args: ["--config=/conf/config.yaml"]
          volumeMounts:
            - { name: cfg, mountPath: /conf }
          ports:
            - { containerPort: 4317 }
            - { containerPort: 4318 }
      volumes:
        - name: cfg
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: otel }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
