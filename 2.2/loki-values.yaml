# 2.2.10 lab — Loki single-binary store (filesystem, no auth) for the class.
# Not a production topology; just enough Loki to receive Promtail's stream and
# answer LogQL. Exposed on a NodePort so LogQL can be run from outside the box.
deploymentMode: SingleBinary

loki:
  auth_enabled: false                 # single-tenant lab
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
  # keep the demo tiny
  rulerConfig: {}

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi                          # writable /var/loki (local-path SC)

# turn OFF every microservices-mode component (single binary handles all)
backend:      { replicas: 0 }
read:         { replicas: 0 }
write:        { replicas: 0 }
ingester:     { replicas: 0 }
querier:      { replicas: 0 }
queryFrontend:{ replicas: 0 }
queryScheduler:{ replicas: 0 }
distributor:  { replicas: 0 }
compactor:    { replicas: 0 }
indexGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
bloomGateway: { replicas: 0 }

# expose the Loki HTTP API on the kind host-port mapping (host :9090 -> 30990 is
# taken by Prometheus; we use the gateway on a fresh NodePort via port-forward in
# the Makefile instead of a host mapping, so ClusterIP is fine here)
gateway:
  enabled: true
  service:
    type: ClusterIP

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring: { enabled: false, grafanaAgent: { installOperator: false } }
