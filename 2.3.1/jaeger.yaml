# 2.3.1 — Jaeger all-in-one (collector + query + UI, in-memory storage).
#
# Stands the Jaeger BACKEND up in the `monitoring` namespace — the address the
# bankobs fleet already exports to and the Grafana datasource (1.5.1) already points
# at (jaeger-query.monitoring.svc:16686). bankobs is already instrumented; it has
# simply had nowhere to send spans until now. OTLP is enabled so services export
# straight to it on 4317 (gRPC) / 4318 (HTTP).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }   # accept OTLP on 4317/4318
          ports:
            - { containerPort: 16686 }   # UI + query API
            - { containerPort: 4317 }    # OTLP gRPC
            - { containerPort: 4318 }    # OTLP HTTP
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector           # the bankobs fleet exports OTLP here
  namespace: monitoring
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query              # UI + query API (Grafana datasource points here)
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686, nodePort: 31686 }   # kind host :16686
