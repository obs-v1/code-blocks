# 2.3.10 lab — Jaeger all-in-one (collector + query + UI, in-memory storage).
# OTLP enabled so services can export straight to it on 4317/4318.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: tracing
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          ports:
            - { containerPort: 16686 }   # UI
            - { containerPort: 4317 }     # OTLP gRPC
            - { containerPort: 4318 }     # OTLP HTTP
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector          # services export here (OTLP)
  namespace: tracing
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query             # UI + query API
  namespace: tracing
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686, nodePort: 31686 }  # kind host :16686
